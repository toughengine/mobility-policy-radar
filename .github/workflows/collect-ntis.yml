name: 정책·공고 수집

# 수집은 토큰을 쓰지 않는다 (curl + 정규식). 그래서 매일 돌려도 비용이 없다.
# 토큰이 드는 것은 이후 Claude 세션이 하는 '분석'뿐이고, 그것은 신규 공고 건수에만 비례한다.
#
# 이 워크플로가 GitHub에서 도는 이유:
#   * Claude 자동화 세션은 Bash를 쓸 수 없다 (승인 대기로 멈춘다).
#   * WebFetch는 egress 허용목록이 적용되지 않아 NTIS가 차단된다.
#   * 그래서 수집만 GitHub 러너에게 맡기고, Claude는 결과를 읽어 분석만 한다.

on:
  schedule:
    # 매일 07:00 KST (= 전날 22:00 UTC). 08:00 KST 브리핑 세션보다 한 시간 앞선다.
    - cron: "0 22 * * *"
  workflow_dispatch:        # Actions 탭에서 수동 실행 ("지금 수집" 버튼 역할)

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 25분이었으나 2026-09-18·19 두 번 연속 정확히 25분에서 잘렸다(conclusion: cancelled).
    # 정책브리핑 44질의 + NTIS 28질의가 느린 날엔 25분을 넘긴다. 한도만 올린다 —
    # 평소 소요는 7~9분이라 실제 사용 시간은 늘지 않는다.
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 정책브리핑 보도자료 수집
        run: python scripts/collect_policy.py | tee -a collect.log

      - name: NTIS 국가R&D통합공고 수집
        run: python scripts/collect_ntis.py | tee -a collect.log

      - name: 나라장터 용역 공고 수집 (저장소 이력용)
        # 대시보드는 Routine이 아티팩트를 DB로 써서 갱신하므로 이 단계는 필수가 아니다.
        # 저장소에 git 이력을 남기려고 도는 것이라, 시크릿이 없으면 조용히 건너뛴다.
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_KEY" ]; then
            echo "DATA_GO_KR_KEY 시크릿이 없어 건너뜁니다 (Routine이 아티팩트를 직접 갱신하므로 대시보드에는 영향 없음)"
          else
            python scripts/collect_bids.py | tee -a collect.log
            python scripts/generate_bid_dashboard.py | tee -a collect.log
          fi

      - name: 신규 후보 수 확인
        id: count
        run: |
          n=$(python -c "import json,pathlib,datetime as dt; d=dt.date.today().isoformat(); print(sum(len(json.loads(p.read_text(encoding='utf-8'))['candidates']) for p in (pathlib.Path('data/inbox')/(x+'-'+d+'.json') for x in ('policy','ntis')) if p.exists()))")
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "신규 후보 $n건"

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inbox data/bids.json artifact/bid_dashboard.html
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략 (신규 공고가 없는 날은 정상이다)"
          else
            git commit -m "NTIS 수집: $(date -u -d '+9 hours' +%Y-%m-%d) (신규 ${{ steps.count.outputs.count }}건)"
            git push
          fi

      - name: 수집 로그 요약
        if: always()
        run: |
          echo "### NTIS 수집 결과" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -20 collect.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(로그 없음)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
